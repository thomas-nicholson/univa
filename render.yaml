services:
  - type: web
    name: univa-web
    runtime: node
    plan: starter
    rootDir: .
    healthCheckPath: /api/health
    buildCommand: |
      npx -y bun@1.2.18 install
      if [ -n "$DATABASE_URL" ]; then
        cd packages/db
        DATABASE_URL=$DATABASE_URL NODE_ENV=production npx -y bun@1.2.18 x drizzle-kit migrate --config=drizzle.config.ts
        cd ../..
      fi
      npx -y bun@1.2.18 x turbo run build --filter=opencut
    startCommand: cd apps/web && PORT=${PORT:-3000} npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_ENABLED
        value: false
      - key: UNIVA_AGENT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_BETTER_AUTH_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
