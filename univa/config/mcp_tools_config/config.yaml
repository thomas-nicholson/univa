# Configuration for mcp_tools
providers:
  fal:
    enabled: true
    text_to_image_model: "fal-ai/flux/schnell"
    image_to_image_model: "fal-ai/flux/dev"
    text_to_video_model: "fal-ai/kling-video/v1/standard/text-to-video"
    image_to_video_model: "fal-ai/kling-video/v1/standard/image-to-video"
    speech_to_text_model: "fal-ai/elevenlabs/speech-to-text"
    text_to_speech_model: "xai/tts/v1"
  wavespeed:
    enabled: true
  hyperframes:
    enabled: true

image_gen:
  provider: "fal"
  text_to_image: "fal-ai/flux/schnell"
  image_to_image: "fal-ai/flux/dev"
  wavespeed_api: ""
  base_output_path: "results/image"

video_editing:
  provider: "hyperframes"
  model_path: ""
  style_transfer: "hyperframes"
  pose_reference: "hyperframes"
  repainting: "hyperframes"
  wavespeed_api: ""
  base_output_path: "results/video"

video_gen:
  provider: "fal"
  text_to_video: "fal-ai/kling-video/v1/standard/text-to-video"
  image_to_video: "fal-ai/kling-video/v1/standard/image-to-video"
  frame_to_frame_video: "fal-ai/kling-video/v1/standard/image-to-video"
  wavespeed_api: ""
  base_output_path: "results/video"
  if_audio: true

audio_gen:
  provider: "hyperframes"
  transcription_provider: "fal"
  wavespeed_api: ""
  default_model: "mmaudio-v2"
  speech_model: "xai/tts/v1"
  default_voice: "eve"
  default_emotion: "neutral"
  base_output_path: "results/audio"
  duration: 5
  guidance_scale: 4.5
  num_inference_steps: 25

video_understanding:
  provider: "gemini"
  default_model: "gemini-2.0-flash"
  detailed_analysis: true
  model_path: ""
  retriever_model_path: ""

video_tracking:
  sa2va_model_path: ""
  sam_model_path: ""

llm:
  model: "gpt-5-2025-08-07"
  openai_api_key: ""

save_service:
  base_output_path: "results/video"
  naming_pattern: "{timestamp}_{file_type}_{description}_{index:03d}"
  cleanup_policy:
    max_age_days: 30
    max_size_gb: 100
